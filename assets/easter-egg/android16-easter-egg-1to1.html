<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Landroid</title>
<style>
:root{--eg:#16161d;--eg2:#292936;--eg3:#3c3c4f;--eg4:#a7a7ca;--console:#b7b7ff;--green:#34a853;--blue:#4285f4;--flag:#c6ff00;--orange:#ff8800}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Roboto,'Segoe UI',system-ui,-apple-system,sans-serif;color:#fff}
canvas{display:block}
#scr-plat{position:fixed;inset:0;background:#000;z-index:1}
#starfield{position:absolute;inset:0;width:100%;height:100%}
#logoBox{position:absolute;left:50%;top:50%;width:min(75vh,75vw);height:min(75vh,75vw);transform:translate(-50%,-50%);cursor:pointer;-webkit-tap-highlight-color:transparent}
#logoBox svg{width:100%;height:100%;display:block;pointer-events:none;transition:transform .12s ease,filter .12s ease}
#logoBox:hover svg{filter:drop-shadow(0 0 14px rgba(255,255,255,.28))}
#logoBox.pressed svg{transform:scale(1.045);filter:drop-shadow(0 0 22px rgba(255,255,255,.5))}
#hint{position:absolute;left:0;right:0;bottom:4vh;text-align:center;color:#ffffff90;font-size:12px;letter-spacing:1px;text-shadow:0 1px 6px #000}
#scr-game{position:fixed;inset:0;z-index:2;display:none;background:var(--eg)}
#gc{position:absolute;inset:0;width:100%;height:100%}
.fadein{animation:fi 1s cubic-bezier(0,1,1,0) both}
@keyframes fi{from{opacity:0}to{opacity:1}}
.panel{position:absolute;font-family:'Cascadia Mono','Consolas','Roboto Mono',monospace;pointer-events:none}
#cat{left:12px;top:12px;color:var(--console);font-size:11px;line-height:1.45;white-space:pre;text-shadow:0 0 6px #000;max-height:calc(100vh - 230px);overflow:hidden}
#tele{left:12px;bottom:12px;color:var(--console);font-size:12px;line-height:1.5;white-space:pre;text-shadow:0 0 6px #000}
#statusCaps{left:12px;bottom:108px;display:flex;gap:6px;align-items:center;font-size:10px;letter-spacing:1px;text-transform:uppercase}
.chip{border:1px solid var(--console);color:var(--console);border-radius:999px;padding:2px 10px;font-family:'Cascadia Mono','Consolas',monospace;background:#00000088;pointer-events:none}
#autoBtn{position:absolute;right:18px;bottom:18px;width:74px;height:74px;border-radius:50%;border:1px solid var(--blue);color:var(--blue);background:transparent;font-family:'Cascadia Mono','Consolas',monospace;font-size:13px;letter-spacing:2px;cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,box-shadow .3s}
#autoBtn:hover{background:#4285f422}
#autoBtn.on{background:var(--blue);color:#fff;box-shadow:0 0 24px #4285f466}
#live{position:absolute;right:14px;top:14px;width:min(340px,calc(100vw - 120px));color:#e6e6e6;pointer-events:none}
.liveCard{background:#1f1f24f2;border-radius:18px;border:1px solid #33333f;padding:12px 14px 10px;display:none;box-shadow:0 8px 30px #000a}
.liveCard .t1{font-size:11px;color:#a9a9b8;letter-spacing:.3px}
.liveCard .t2{font-size:14px;margin-top:2px}
.liveCard .t3{font-size:12px;color:#cfcfd8;margin-top:2px;white-space:pre-line}
.liveCard .t4{font-size:11px;color:#7f7f92;margin-top:6px}
.liveCard .bar{height:6px;border-radius:3px;background:#33333f;margin-top:8px;overflow:hidden}
.liveCard .bar i{display:block;height:100%;width:0;background:var(--green);border-radius:3px;transition:width .9s linear}
.liveCard.ind .bar i{width:100%;animation:ind 1.2s linear infinite}
@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
.liveCard .bar.ind2 i{width:40%;background:var(--green);animation:ind 1.2s linear infinite}
#sbtn{position:absolute;right:14px;bottom:110px;pointer-events:auto;cursor:pointer;color:#9aa0ad;font-size:10px;letter-spacing:.5px;font-family:'Cascadia Mono','Consolas',monospace;padding:6px 10px;border:1px solid #444;border-radius:8px;background:#111118cc}
#kbd{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);color:#ffffff66;font-size:11px;letter-spacing:.6px;white-space:nowrap;pointer-events:none;font-family:'Cascadia Mono','Consolas',monospace}
#fadeout{position:fixed;inset:0;background:#000;z-index:9;opacity:0;pointer-events:none;transition:opacity .6s}
</style>
</head>

 "baklava_flora_generic_plurals": ["flora", "plants", "flowers", "trees", "mosses", "specimens", "life", "cells"], "baklava_atmo_generic_plurals": ["air", "atmosphere", "clouds", "atmo", "gases"], "baklava_activities": ["refueling", "sightseeing", "vacationing", "luncheoning", "recharging", "taking up space", "reticulating space splines", "using facilities", "spelunking", "repairing", "herding {fauna}", "taming {fauna}", "breeding {fauna}", "singing lullabies to {fauna}", "singing lullabies to {flora}", "singing lullabies to the {planet}", "gardening {flora}", "collecting {flora}", "surveying the {planet}", "mapping the {planet}", "breathing {atmo}", "reprocessing {atmo}", "bottling {atmo}"]};
// ---- math / vec2 ----
var PI2 = Math.PI*2;
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function expSmooth(cur,tgt,dt,speed){var f=1-Math.exp(-speed*dt);return cur+(tgt-cur)*f;}
function smooth(t){return t*t*t*(t*(t*6-15)+10);}
function lexp(a,b,x){ // log-ish ease from 0..1 clamped
  var k=5,t=clamp(x,0,1);var e=Math.exp(k*(t-1));return a+(b-a)*(1-e);
}
function PVec(x,y){this.x=x||0;this.y=y||0;}
PVec.Zero=function(){return new PVec(0,0);};
PVec.prototype.clone=function(){return new PVec(this.x,this.y);};
PVec.prototype.set=function(x,y){this.x=x;this.y=y;return this;};
PVec.prototype.add=function(o){return new PVec(this.x+o.x,this.y+o.y);};
PVec.prototype.sub=function(o){return new PVec(this.x-o.x,this.y-o.y);};
PVec.prototype.mul=function(k){return new PVec(this.x*k,this.y*k);};
PVec.prototype.mag=function(){return Math.sqrt(this.x*this.x+this.y*this.y);};
PVec.prototype.angle=function(){return Math.atan2(this.y,this.x);};
PVec.prototype.normalized=function(){var m=this.mag();return m>0?new PVec(this.x/m,this.y/m):new PVec(0,0);};
PVec.prototype.dot=function(o){return this.x*o.x+this.y*o.y;};
PVec.prototype.abs=function(){return new PVec(Math.abs(this.x),Math.abs(this.y));};
PVec.fromAngleMag=function(a,m){return new PVec(Math.cos(a)*m,Math.sin(a)*m);};
function vadd(a,b){return new PVec(a.x+b.x,a.y+b.y);}
function vsub(a,b){return new PVec(a.x-b.x,a.y-b.y);}
function vmul(v,k){return new PVec(v.x*k,v.y*k);}
function vfmt(x,y){return String.fromCharCode(x>=0?43:45)+String(Math.abs(x)|0).padStart(7,'0')+' '+String.fromCharCode(y>=0?43:45)+String(Math.abs(y)|0).padStart(7,'0');}
// ---- rng: mulberry32 ----
function Rand(seed){this.s=seed>>>0;}
Rand.prototype.next=function(){this.s=(this.s+0x6D2B79F5)>>>0;var t=this.s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};
Rand.prototype.nextFloat=function(){return this.next();};
Rand.prototype.nextInt=function(a,b){return a+Math.floor(this.next()*(b-a));};
Rand.prototype.nextFloatInRange=function(a,b){return a+this.next()*(b-a);};
Rand.prototype.choose=function(arr){return arr[this.nextInt(0,arr.length)];};
function Bag(items){this.items=items;}
Bag.prototype.pull=function(rng){return rng.choose(this.items);};
function RandomTable(entries){this.entries=entries;this.total=0;for(var i=0;i<entries.length;i++)this.total+=entries[i][0];}
RandomTable.prototype.roll=function(rng){var r=rng.nextFloat()*this.total;for(var i=0;i<this.entries.length;i++){r-=this.entries[i][0];if(r<=0)return this.entries[i][1];}return this.entries[this.entries.length-1][1];};
// ---- palette (source Colors.kt / starColor) ----
var COL={eg:0x16161d,eg2:0x292936,eg3:0x3c3c4f,eg4:0xa7a7ca,console:0xb7b7ff,autopilot:0x4285f4,track:0x34a853,flag:0xc6ff00,orange:0xff8800,white:0xffffff,black:0x000000,cc:0xcccccc};
var STAR_COLORS={O:0x6666ff,B:0xccccff,A:0xeeeeff,F:0xffffff,G:0xffff66,K:0xffcc33,M:0xff8800};
function hex(c,a){if(a===undefined)a=1;return 'rgba('+((c>>16)&255)+','+((c>>8)&255)+','+(c&255)+','+a+')';}
// ---- Namer (port of Namer.kt; WORDS injected by builder) ----
function Namer(rng){
  this.rng=rng;
  var W=WORDS;
  this.planetDescriptors=new Bag(W.baklava_planet_descriptors);
  this.lifeDescriptors=new Bag(W.baklava_life_descriptors);
  this.anyDescriptors=new Bag(W.baklava_any_descriptors);
  this.atmoDescriptors=new Bag(W.baklava_atmo_descriptors);
  this.planetTypes=new Bag(W.baklava_planet_types);
  this.constellations=new Bag(W.baklava_constellations);
  this.constellationsRare=new Bag(W.baklava_constellations_rare);
  this.suffixes=new Bag(W.baklava_star_suffixes);
  this.suffixesRare=new Bag(W.baklava_star_suffixes_rare);
  this.planetTable=new RandomTable([[0.75,this.planetDescriptors],[0.25,this.anyDescriptors]]);
  this.lifeTable=new RandomTable([[0.75,this.lifeDescriptors],[0.25,this.anyDescriptors]]);
  this.constellationsTable=new RandomTable([[0.05,this.constellationsRare],[0.95,this.constellations]]);
  this.suffixesTable=new RandomTable([[0.05,this.suffixesRare],[0.95,this.suffixes]]);
  this.atmoTable=new RandomTable([[0.75,this.atmoDescriptors],[0.25,this.anyDescriptors]]);
  this.delimiterTable=new RandomTable([[15,' '],[3,'-'],[1,'_'],[1,'/'],[1,'.'],[1,'*'],[1,'^'],[1,'#'],[0.1,'(^*!%@##!!']]);
  this.activities=new Bag(W.baklava_activities);
  this.floraGP=new Bag(W.baklava_flora_generic_plurals);
  this.faunaGP=new Bag(W.baklava_fauna_generic_plurals);
  this.atmoGP=new Bag(W.baklava_atmo_generic_plurals);
}
Namer.prototype.capitalize=function(s){return s?s.charAt(0).toUpperCase()+s.slice(1).toLowerCase():s;};
Namer.prototype.describePlanet=function(){return this.planetTable.roll(this.rng).pull(this.rng)+' '+this.planetTypes.pull(this.rng);};
Namer.prototype.describeLife=function(){return this.lifeTable.roll(this.rng).pull(this.rng);};
Namer.prototype.nameSystem=function(){
  var parts=this.constellationsTable.roll(this.rng).pull(this.rng);
  if(this.rng.nextFloat()<=0.75){parts+=this.delimiterTable.roll(this.rng)+this.suffixesTable.roll(this.rng).pull(this.rng);
    if(this.rng.nextFloat()<=0.05)parts+=' '+this.suffixesRare.pull(this.rng);}
  if(this.rng.nextFloat()<=0.3){parts+=this.delimiterTable.roll(this.rng)+String.fromCharCode(65+this.rng.nextInt(0,26));
    if(this.rng.nextFloat()<=0.05)parts+=this.delimiterTable.roll(this.rng);}
  if(this.rng.nextFloat()<=0.3){parts+=this.delimiterTable.roll(this.rng)+this.rng.nextInt(2,5039);}
  return parts;
};
Namer.prototype.describeAtmo=function(){return this.atmoTable.roll(this.rng).pull(this.rng);};
Namer.prototype.describeActivity=function(target){
  var namer=this;
  return this.activities.pull(this.rng).replace(/\{(flora|fauna|planet|atmo)\}/g,function(m,tag){
    if(tag==='flora')return (target&&target.flora?target.flora:'SOME')+' '+namer.floraGP.pull(namer.rng);
    if(tag==='fauna')return (target&&target.fauna?target.fauna:'SOME')+' '+namer.faunaGP.pull(namer.rng);
    if(tag==='atmo')return (target&&target.atmosphere?target.atmosphere:'SOME')+' '+namer.atmoGP.pull(namer.rng);
    return (target&&target.description?target.description:'SOME BODY');
  });
};

// ---- universe constants (source Universe.kt) ----
var UNIVERSE_RANGE=200000;
var NUM_PLANETS_RANGE=[1,10];
var STAR_RADIUS_RANGE=[1000,8000];
var PLANET_RADIUS_RANGE=[50,2000];
var PLANET_ORBIT_RANGE=[STAR_RADIUS_RANGE[1]*2,UNIVERSE_RANGE*0.75];
var GRAVITATION=1e-2;
var KEPLER_CONSTANT=50;
var PLANETARY_DENSITY=2.5;
var STELLAR_DENSITY=0.5;
var SPACECRAFT_MASS=10;
var CRAFT_SPEED_LIMIT=5000;
var MAIN_ENGINE_ACCEL=1000;
var LAUNCH_MECO=2;
var LANDING_REMOVAL_TIME=60*15;
var SCALED_THRUST=true;
var TRACK_LENGTH=10000;
// ---- simulator primitives ----
function Body(name){this.name=name||'';this.pos=new PVec(0,0);this.opos=new PVec(0,0);this.velocity=new PVec(0,0);this.radius=0;this.mass=0;this.collides=false;this.color=COL.white;}
Body.prototype.update=function(sim,dt){this.opos.set(this.pos.x,this.pos.y);this.pos.x+=this.velocity.x*dt;this.pos.y+=this.velocity.y*dt;};
Body.prototype.postUpdate=function(){};
function Simulator(seed){this.rng=new Rand(seed);this.entities=[];this.constraints=[];this.now=0;this.dt=0.016;this.listeners=[];}
Simulator.prototype.add=function(e){this.entities.push(e);return e;};
Simulator.prototype.remove=function(e){var i=this.entities.indexOf(e);if(i>=0)this.entities.splice(i,1);};
Simulator.prototype.addSimulationStepListener=function(f){this.listeners.push(f);return {dispose:function(){}};};
Simulator.prototype.step=function(now){
  var dt=Math.min((now-(this._last||now))/1000,1);this._last=now;
  if(!(dt>0))dt=0.016;
  this.dt=dt;this.now+=dt;
  this.updateAll(dt,this.entities);
  this.solveAll(dt,this.constraints);
  this.postUpdateAll(dt,this.entities);
  for(var i=0;i<this.listeners.length;i++)this.listeners[i]();
};
Simulator.prototype.updateAll=function(dt,entities){for(var i=0;i<entities.length;i++){entities[i].update(this,dt);}};
Simulator.prototype.solveAll=function(dt,constraints){for(var i=0;i<constraints.length;i++)constraints[i].solve(this,dt);};
Simulator.prototype.postUpdateAll=function(dt,entities){for(var i=0;i<entities.length;i++){var e=entities[i];e.postUpdate(this,dt);}for(i=entities.length-1;i>=0;i--){if(entities[i]._dead)this.entities.splice(i,1);}for(i=this.constraints.length-1;i>=0;i--){if(this.constraints[i]._dead)this.constraints.splice(i,1);}};
function Container(range){this.range=range;this.ship=null;}
Container.prototype.solve=function(sim,dt){if(!this.ship)return;var m=this.ship.pos.mag();if(m>this.range){this.ship.pos=this.ship.pos.mul(this.range/m);this.ship.velocity=this.ship.velocity.mul(0.98);}};
// ---- Planet / Star ----
function Planet(orbitCenter,radius,pos,speed,color){Body.call(this,'Planet');this.orbitCenter=orbitCenter;this.radius=radius;this.pos=pos;this.speed=speed||0;this.color=color===undefined?COL.white:color;this.atmosphere='';this.description='';this.flora='';this.fauna='';this.explored=false;this.mass=(4/3)*Math.PI*Math.pow(radius,3)*PLANETARY_DENSITY;this.landings=[];}
Planet.prototype=Object.create(Body.prototype);
Planet.prototype.update=function(sim,dt){var a=(this.pos.sub(this.orbitCenter)).angle();this.velocity=new PVec(Math.cos(a+Math.PI/2)*this.speed,Math.sin(a+Math.PI/2)*this.speed);Body.prototype.update.call(this,sim,dt);};
Planet.prototype.postUpdate=function(sim,dt){var orbitAngle=(this.pos.sub(this.orbitCenter)).angle();var r=this.pos.sub(this.orbitCenter).mag();this.pos=this.orbitCenter.add(new PVec(Math.cos(orbitAngle)*r,Math.sin(orbitAngle)*r));Body.prototype.postUpdate.call(this,sim,dt);};
function Star(cls,radius){Body.call(this,'Star');this.cls=cls;this.radius=radius;this.pos=new PVec(0,0);this.color=STAR_COLORS[cls];this.mass=(4/3)*Math.PI*Math.pow(radius,3)*STELLAR_DENSITY;this.anim=0;this.collides=true;this.name='';}
Star.prototype=Object.create(Body.prototype);
Star.prototype.update=function(sim,dt){this.anim+=dt;Body.prototype.update.call(this,sim,dt);};
// ---- Track / Spacecraft / Landing / Spark ----
function Track(){this.positions=[];this.angles=[];}
Track.prototype.add=function(x,y,a){if(this.positions.length>=TRACK_LENGTH-1){this.positions.shift();this.angles.shift();this.positions.shift();this.angles.shift();}this.positions.push(new PVec(x,y));this.angles.push(a);};
function Spacecraft(){Body.call(this,'Spacecraft');this.mass=SPACECRAFT_MASS;this.radius=12;this.thrust=new PVec(0,0);this.launchClock=0;this.transit=false;this.track=new Track();this.landing=null;this.autopilot=null;this.angle=0;}
Spacecraft.prototype=Object.create(Body.prototype);
Spacecraft.prototype.update=function(sim,dt){
  if(this.landing&&this.landing._dead)this.landing=null;
  var thrustMag=this.thrust.mag();
  if(thrustMag>0){
    var deltaV=MAIN_ENGINE_ACCEL*dt;
    if(SCALED_THRUST)deltaV*=clamp(thrustMag,0,1);
    if(this.landing){
      if(this.launchClock===0)this.launchClock=sim.now+1;
      if(sim.now>this.launchClock){this.landing.ship=null;this.landing=null;}
      else deltaV=0;
    }
    this.velocity=this.velocity.add(new PVec(Math.cos(this.angle)*deltaV,Math.sin(this.angle)*deltaV));
  }else if(this.launchClock!==0)this.launchClock=0;
  if(this.velocity.mag()>CRAFT_SPEED_LIMIT)this.velocity=new PVec(Math.cos(this.velocity.angle())*CRAFT_SPEED_LIMIT,Math.sin(this.velocity.angle())*CRAFT_SPEED_LIMIT);
  Body.prototype.update.call(this,sim,dt);
};
Spacecraft.prototype.postUpdate=function(sim,dt){
  Body.prototype.postUpdate.call(this,sim,dt);
  this.track.add(this.pos.x,this.pos.y,this.angle);
  var mag=this.thrust.mag();
  if(sim.rng.nextFloat()<mag&&this.thrust.mag()>0){
    var spark=new Spark(1,true,0,Spark.RING,0x40ffffff,1,sim.rng.nextFloatInRange(0.5,1));
    spark.pos=this.pos.clone();spark.opos=this.pos.clone();
    spark.velocity=this.velocity.add(new PVec(Math.cos(this.angle+sim.rng.nextFloatInRange(-0.2,0.2)),Math.sin(this.angle+sim.rng.nextFloatInRange(-0.2,0.2))).mul(-MAIN_ENGINE_ACCEL*clamp(mag,0,1)*10*dt));
    sim.add(spark);
  }
};
function Landing(ship,planet,angle,text){this.ship=ship;this.planet=planet;this.angle=angle;this.text=text||'';this.age=0;}
Landing.prototype.solve=function(sim,dt){
  if(this.ship){var lv=new PVec(Math.cos(this.angle)*this.radiusD(),Math.sin(this.angle)*this.radiusD());var desired=this.planet.pos.add(lv);this.ship.pos=new PVec(this.ship.pos.x*0.5+desired.x*0.5,this.ship.pos.y*0.5+desired.y*0.5);this.ship.angle=this.angle;}
  this.age+=dt;if(this.age>=LANDING_REMOVAL_TIME){this._dead=true;var i=this.planet.landings.indexOf(this);if(i>=0)this.planet.landings.splice(i,1);}
};
Landing.prototype.radiusD=function(){return (this.ship?this.ship.radius:0)+this.planet.radius;};
Landing.prototype.canBeRemoved=function(){return this.age>=LANDING_REMOVAL_TIME;};
Spark.LINE=0;Spark.LINE_ABSOLUTE=1;Spark.DOT=2;Spark.DOT_ABSOLUTE=3;Spark.RING=4;
function Spark(ttl,collides,mass,style,color,size,fuse){Body.call(this,'Spark');this.ttl=ttl;this.collides=!!collides;this.mass=mass||0;this.style=style===undefined?Spark.LINE:style;this.color=color===undefined?0x808080:color;this.size=size===undefined?2:size;this.age=fuse===undefined?0:fuse;}
Spark.prototype=Object.create(Body.prototype);
Spark.prototype.update=function(sim,dt){Body.prototype.update.call(this,sim,dt);this.age+=dt;if(this.age>=this.ttl)this._dead=true;};

// ---- Universe ----
function Universe(namer,randomSeed){Simulator.call(this,randomSeed);this.namer=namer;this.latestDiscovery=null;this.star=null;this.ship=null;this.planets=[];this.follow=null;this.ringfence=new Container(UNIVERSE_RANGE);this.systemName='';this.seed=randomSeed;this.initRandom();}
Universe.prototype=Object.create(Simulator.prototype);
Universe.prototype.initRandom=function(){
  var rng=this.rng;
  var systemName=this.namer.nameSystem();this.systemName=systemName;
  this.star=new Star(rng.choose(['O','B','A','F','G','K','M']),rng.nextFloatInRange(STAR_RADIUS_RANGE[0],STAR_RADIUS_RANGE[1]));
  this.star.name=systemName;
  var n=rng.nextInt(NUM_PLANETS_RANGE[0],NUM_PLANETS_RANGE[1]+1);
  var self=this;
  for(var i=0;i<n;i++){
    var radius=rng.nextFloatInRange(PLANET_RADIUS_RANGE[0],PLANET_RADIUS_RANGE[1]);
    var orbitRadius=lerp(PLANET_ORBIT_RANGE[0],PLANET_ORBIT_RANGE[1],rng.nextFloat());
    var period=Math.sqrt(Math.pow(orbitRadius,3)/this.star.mass)*KEPLER_CONSTANT;
    var speed=2*Math.PI*orbitRadius/period;
    var p=new Planet(new PVec(0,0),radius,new PVec(0,0).add(PVec.fromAngleMag(rng.nextFloat()*PI2,orbitRadius)),speed,COL.eg4);
    p.description=this.namer.describePlanet();
    p.atmosphere=this.namer.describeAtmo();
    p.flora=this.namer.describeLife();
    p.fauna=this.namer.describeLife();
    this.planets.push(p);this.add(p);
  }
  this.planets.sort(function(a,b){return a.pos.mag()-b.pos.mag();});
  var p2=this.planets;
  for(i=0;i<p2.length;i++)p2[i].name=systemName+' '+(i+1);
  this.add(this.star);
  this.ship=new Spacecraft();

// ---- Autopilot (port of Autopilot.kt) ----
function Autopilot(ship,universe){this.ship=ship;this.universe=universe;this.enabled=false;this.target=null;this.landingAltitude=0;this.nextStrategyTime=0;this.brakingDistance=0;this.leadingPos=new PVec(0,0);this.leadingVector=new PVec(0,0);this.strategy='NONE';this.debug='';this.BRAKING_TIME=5;this.SIGHTSEEING_TIME=15;this.LAUNCH_THRUST_TIME=5;this.STRATEGY_MIN_TIME=0.5;}
Autopilot.prototype.telemetry=function(){return this.enabled?('---- AUTOPILOT ENGAGED ----\nTGT: '+(this.target?(this.target.name||'').toUpperCase():'SELECTING...')+'\nEXE: '+this.strategy+(this.debug?(' ('+this.debug+')'):'')):'';};
Autopilot.prototype.update=function(sim,dt){
  if(!this.enabled)return;
  if(sim.now<this.nextStrategyTime)return;
  var ap=this;var currentStrategy=this.strategy;
  if(this.ship.landing!==null){
    if(this.target!==null){this.strategy='LANDED';this.debug='';this.target=null;this.landingAltitude=0;this.nextStrategyTime=sim.now+this.SIGHTSEEING_TIME;}
    else{
      this.ship.thrust=PVec.fromAngleMag(this.ship.angle,1);
      this.strategy='LAUNCHING';this.debug='';this.nextStrategyTime=sim.now+this.LAUNCH_THRUST_TIME;
    }
  }else{
    if(this.target===null){
      var unexpl=null,self=this;
      var sorted=this.universe.planets.slice().sort(function(a,b){return a.pos.sub(self.ship.pos).mag()-b.pos.sub(self.ship.pos).mag();});
      for(var i=0;i<sorted.length;i++){if(!sorted[i].explored){unexpl=sorted[i];break;}}
      this.target=unexpl||this.universe.planets[Math.floor(this.universe.rng.nextFloat()*this.universe.planets.length)];
      this.brakingDistance=0;
    }
    if(this.target){
      var t=this.target,shipV=this.ship.velocity,targetV=t.velocity;
      var targetVector=t.pos.sub(this.ship.pos);
      var altitude=targetVector.mag()-t.radius;
      this.landingAltitude=Math.min(t.radius,100);
      var relativeV=shipV.sub(targetV);
      var magTV=targetVector.mag()||1;
      var projection=relativeV.dot(targetVector.mul(1/magTV));
      var relSpeed=relativeV.mag()*Math.sign(projection);
      var timeToTarget=relSpeed!==0?(altitude/relSpeed):1000;
      var newBD=this.BRAKING_TIME*(relSpeed>0?relSpeed:MAIN_ENGINE_ACCEL);
      this.brakingDistance=expSmooth(this.brakingDistance,newBD,sim.dt,5);
      var mv=t.velocity.mag();
      this.leadingPos=t.pos.add(PVec.fromAngleMag(t.velocity.angle(),Math.min(altitude/2,mv)));
      this.leadingVector=this.leadingPos.sub(this.ship.pos);
      if(altitude<this.landingAltitude){
        this.strategy='LANDING';
        this.ship.angle=(this.ship.pos.sub(t.pos)).angle();
        this.ship.thrust=new PVec(0,0);
      }else{
        if(relSpeed<0||altitude>this.brakingDistance){
          this.strategy='CHASING';
          this.ship.angle=this.leadingVector.angle();
          this.ship.thrust=PVec.fromAngleMag(this.ship.angle,1);
        }else{
          this.strategy='APPROACHING';
          this.ship.angle=(-this.ship.velocity).angle();
          var decel=relSpeed/timeToTarget;
          var decelThrust=decel/MAIN_ENGINE_ACCEL*0.9;
          this.ship.thrust=PVec.fromAngleMag(this.ship.angle,decelThrust);
        }
      }
      this.debug='DV='+relSpeed.toFixed(0)+' D='+altitude.toFixed(0)+' T'+(timeToTarget>=0?'+':'-')+Math.abs(timeToTarget).toFixed(1);
    }
    if(this.strategy!==currentStrategy)this.nextStrategyTime=sim.now+this.STRATEGY_MIN_TIME;
  }
};

// ---- shape utilities ----
function parseSvgToLocal(pathStr,radius){
  var seg=pathStr.replace(/([MLC])/g,'|$1').split('|').filter(Boolean);

  for(var s=0;s<seg.length;s++){
    var m=seg[s].trim();if(!m.length)continue;
    var cmd=m.charAt(0);var nums=m.slice(1).trim().split(/[\s,]+/).filter(Boolean).map(Number);
    if(cmd==='M'){cx=nums[0];cy=nums[1];start=[cx,cy];pts.push([cx,cy]);}
    else if(cmd==='L'){cx=nums[0];cy=nums[1];pts.push([cx,cy]);}
    else if(cmd==='C'){
      var p0x=cx,p0y=cy,p1x=nums[0],p1y=nums[1],p2x=nums[2],p2y=nums[3],p3x=nums[4],p3y=nums[5];

      cx=p3x;cy=p3y;

  var mx=0,my=0;for(var i=0;i<pts.length;i++){mx+=pts[i][0];my+=pts[i][1];}
  mx/=pts.length;my/=pts.length;

function shapeFromPath(pathStr,radius){return parseSvgToLocal(pathStr,radius);}
function buildPolygonLocal(radius,rotation){

function createStarPath(radius,rotation){

  var ss=w2s(ship.pos);

    if(ts.x>-500&&ts.x<CW+500&&ts.y>-500&&ts.y<CH+500){
      ctx.setLineDash([6,6]);

      ctx.beginPath();ctx.moveTo(ss.x,ss.y);ctx.lineTo(ts.x,ts.y);ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();ctx.arc(ts.x,ts.y,targetR+6,0,PI2);ctx.stroke();
      var bd=Math.max(ap.brakingDistance*CAM.zoom,targetR+16);
      ctx.strokeStyle=hex(COL.autopilot,0.4);
      ctx.beginPath();ctx.arc(ts.x,ts.y,bd,0,PI2);ctx.stroke();
      var lp=w2s(ap.leadingPos);

    }

    var tn=ap.target.name||'';

}
function drawWorldLabels(ctx){
  var ship=universe.ship;

  for(var i=0;i<bodies.length;i++){
    var b=bodies[i];var c=w2s(b.pos);var rad=b.radius*CAM.zoom;
    if(b.explored&&rad>6&&!b.collides&&false){}// placeholder
  }
  if(ship.landing){
    var lp=ship.landing.planet;var lc=w2s(lp.pos);

function drawUniverse(){
  var ctx=gctx;
  ctx.clearRect(0,0,CW,CH);
  ctx.fillStyle='#16161d';
  ctx.fillRect(0,0,CW,CH);
  drawGrid(ctx);
  if(!universe)return;
  drawGravFields(ctx);
  // orbits behind
  for(var i=0;i<universe.planets.length;i++)drawOrbitRing(ctx,universe.planets[i]);
  drawTrack(ctx);
  drawStarBody(ctx,universe.star);
  for(i=0;i<universe.planets.length;i++)drawPlanet(ctx,universe.planets[i]);
  // landings flags
  for(i=0;i<universe.planets.length;i++){var pl=universe.planets[i];for(var f=0;f<pl.landings.length;f++)drawLanding(ctx,pl.landings[f]);}
  drawAutopilotUI(ctx);
  // sparks
  for(i=0;i<universe.entities.length;i++){var e=universe.entities[i];if(e instanceof Spark)drawSpark(ctx,e);}
  drawSpacecraft(ctx,universe.ship);

}
function tick(now){
  requestAnimationFrame(tick);
  if(!universe)return;
  // follow camera
  var tgt=CAM.follow||universe.ship;
  CAM.x=expSmooth(CAM.x,tgt.pos.x,Math.min((now-lastt)/1000,0.05),6);
  CAM.y=expSmooth(CAM.y,tgt.pos.y,Math.min((now-lastt)/1000,0.05),6);
  universe.step(now);
  universe.ship.autopilot.update(universe,universe.dt);
  // manual thrust via held keys
  applyKeys();
  drawUniverse();
  lastt=now;
}

// ---- HUD (text port of MainActivity telemetry/catalog + UniverseProgressNotifier) ----
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1).toLowerCase():s;}
function designation(u){return 'UDC-'+((u.seed>>>0)%100000);}
var CAT=document.getElementById('cat'),TEL=document.getElementById('tele'),CAPS=document.getElementById('statusCaps');
var LVCARD=document.getElementById('liveCard'),LV_SHORT=document.getElementById('lvShort'),LV_TITLE=document.getElementById('lvTitle'),LV_TEXT=document.getElementById('lvText'),LV_SUB=document.getElementById('lvSub'),LV_BAR=document.getElementById('lvBar');

var chipCache=[];
function setChips(names){

function fmtG(v){return String.fromCharCode(v>=0?43:45)+String(Math.abs(Math.round(v))).padStart(6,"0");}
function updateHud(){
  if(!universe)return;
  var u=universe,ship=u.ship,ap=ship.autopilot;
  var distToClosest=-1;var cpl=u.closestPlanet();
  if(cpl)distToClosest=(cpl.pos.sub(ship.pos).mag()-cpl.radius-ship.radius);
  var tele='';

  }else{

    tele+='THR: '+Math.round((ship.thrust.mag())*100)+'%'+(ap&&ap.enabled?('   '+ap.strategy):'')+'\n';
    tele+='POS: '+fmtG(ship.pos.x)+' '+fmtG(ship.pos.y)+'\n';
    tele+='VEL: '+Math.round(ship.velocity.mag());
  }
  TEL.textContent=tele;
  // state chips
  if(ship.landing){setChips(['landed']);}
  else if(ap&&ap.enabled){setChips([ap.target?('en route: '+(ap.target.name||'')):'in space','autopilot']);}
  else setChips(['adrift']);
  // star catalog
  var cat='';
  cat+='CATALOG\n';
  cat+='  STAR: '+(u.star.name||'')+' ('+designation(u)+')\n';
  cat+=' CLASS: '+u.star.cls+'\n';
  cat+='RADIUS: '+Math.round(u.star.radius)+'\n';
  cat+='  MASS: '+fmtG3(u.star.mass)+'\n';
  cat+='BODIES: '+u.exploredCount()+' / '+u.planets.length+'\n\n';
  for(var i=0;i<u.planets.length;i++){
    var p=u.planets[i];
    if(!p.explored)continue;
    cat+='  BODY: '+p.name+'\n';
    cat+='  TYPE: '+cap(p.description)+'\n';
    cat+='  ATMO: '+cap(p.atmosphere)+'\n';
    cat+=' FAUNA: '+cap(p.fauna)+'\n';
    cat+=' FLORA: '+cap(p.flora)+'\n\n';
  }
  CAT.textContent=cat;
  updateLive();
}
function fmtG3(v){if(!isFinite(v))return '0';if(v>=1e6||v<1e-3)return v.toExponential(2).replace('e','e');return (Math.round(v*1000)/1000)+'';}
function updateLive(){
  var u=universe,ship=u.ship,ap=ship.autopilot;

  LV_SUB.textContent=designation(u);

  }else if(ap&&ap.enabled){
    if(ap.target){
      if(ap.target!==ap._lastTgt){ap._lastTgt=ap.target;ap._initDist=0;}
      var dist=Math.max(0,Math.round((ap.target.pos.sub(ship.pos).mag()-ap.target.radius)));
      if(!ap._initDist)ap._initDist=dist;
      var init=ap._initDist||dist;
      var speed=ship.velocity.mag();
      var eta=speed>0?(dist/speed).toFixed(0)+'s':'???';
      LV_SHORT.textContent='en route';
      LV_TITLE.textContent='headed to: '+ap.target.name;
      LV_TEXT.textContent='autopilot is '+ap.strategy.toLowerCase()+'\ndist: '+dist+'u // eta: '+eta;
      var frac=init>0?clamp((init-dist)/init,0,1):0;
      LV_BAR.className='bar';LV_BAR.innerHTML='<i style="width:'+(frac*100).toFixed(1)+'%"></i>';
    }else{
      ap._initDist=0;

      LV_TITLE.textContent='in space';

      LV_BAR.className='bar ind2';LV_BAR.innerHTML='<i></i>';
    }
  }else{
    LV_SHORT.textContent='adrift';
    LV_TITLE.textContent='in space';
    LV_TEXT.textContent='under manual control';

  }

}
Universe.prototype.exploredCount=function(){var n=0;for(var i=0;i<this.planets.length;i++)if(this.planets[i].explored)n++;return n;};

// ---- Autopilot refined (state machine override) ----
Autopilot.prototype.update=function(sim,dt){
  if(!this.enabled){this.target=null;this.strategy='NONE';this.debug='';return;}
  var ship=this.ship;
  if(ship.landing){
    if(this.strategy!=='LANDED'&&this.strategy!=='LAUNCHING'){
      this.strategy='LANDED';this.target=null;this.debug='sightseeing';this.nextStrategyTime=sim.now+this.SIGHTSEEING_TIME;
      this.brakingDistance=0;
      return;
    }
    if(this.strategy==='LANDED'){
      if(sim.now<this.nextStrategyTime){ship.thrust=new PVec(0,0);return;}
      this.strategy='LAUNCHING';this.nextStrategyTime=sim.now+this.LAUNCH_THRUST_TIME;this.debug='';
      return;
    }
    if(this.strategy==='LAUNCHING'){
      ship.thrust=PVec.fromAngleMag(ship.angle,1);
      if(sim.now>this.nextStrategyTime){this.strategy='NONE';}
      return;
    }
    return;
  }
  // free flight
  if(this.target===null||this.strategy==='NONE'||this.strategy==='LANDED'||this.strategy==='LAUNCHING'){
    var best=null,bd=Infinity;
    for(var i=0;i<this.universe.planets.length;i++){var pp=this.universe.planets[i];if(pp.explored&&this.strategy!=='NONE')continue;var dd=pp.pos.sub(ship.pos).mag();if(dd<bd){bd=dd;best=pp;}}
    if(!best){best=this.universe.planets[Math.floor(this.universe.rng.nextFloat()*this.universe.planets.length)];}
    this.target=best;this.brakingDistance=0;this.strategy='CHASING';this.debug='';this._initDist=0;
  }
  var t=this.target;
  var targetVector=t.pos.sub(ship.pos);
  var altitude=targetVector.mag()-t.radius;
  var relV=ship.velocity.sub(t.velocity);
  var magTV=targetVector.mag()||1;
  var proj=relV.dot(targetVector.mul(1/magTV));
  var relSpeed=relV.mag()*(proj>=0?1:-1);
  var timeToTarget=relSpeed!==0?Math.abs(altitude/relSpeed):1e3;
  var newBD=this.BRAKING_TIME*Math.abs(relSpeed);
  this.brakingDistance=expSmooth(this.brakingDistance,newBD,sim.dt,4);
  var mv=t.velocity.mag();
  var leadDist=Math.min(Math.max(altitude*0.35,0),Math.max(mv*3,500));
  this.leadingPos=t.pos.add(t.velocity.normalized().mul(leadDist));
  this.leadingVector=this.leadingPos.sub(ship.pos);
  this.landingAltitude=Math.min(t.radius*0.5,Math.max(60,Math.sqrt(t.radius)*2));
  if(altitude<this.landingAltitude){
    this.strategy='LANDING';
    ship.angle=targetVector.angle();
    ship.thrust=new PVec(0,0);
    this.debug='DV='+relSpeed.toFixed(0)+' D='+altitude.toFixed(0);
    if(ship.velocity.mag()<20){ship.velocity=t.velocity.clone();}
    return;
  }
  var leadV=this.leadingVector;
  if(relSpeed< -10||altitude>this.brakingDistance*1.6){
    this.strategy='CHASING';
    ship.angle=leadV.angle();
    ship.thrust=PVec.fromAngleMag(ship.angle,1);
  }else{
    this.strategy='APPROACHING';
    ship.angle=(-ship.velocity).angle();
    var decel=Math.abs(relSpeed)/Math.max(timeToTarget,0.1);
    ship.thrust=PVec.fromAngleMag(ship.angle,clamp(decel/MAIN_ENGINE_ACCEL,0.15,0.95));
  }
  this.debug='DV='+relSpeed.toFixed(0)+' D='+altitude.toFixed(0)+' BD='+this.brakingDistance.toFixed(0);
};
// ---- input / boot ----
var scrPlat=document.getElementById('scr-plat'),sf=document.getElementById('starfield'),sctx=sf.getContext('2d');
var logoBox=document.getElementById('logoBox'),hintEl=document.getElementById('hint');
function buildUniverse(seed){
  var s=seed===undefined?(Date.now()^Math.floor(Math.random()*0xffffffff)):seed;
  var namer=new Namer(new Rand(((s^0x9e3779b9)>>>0)||7));
  universe=new Universe(namer,s>>>0);
  universe.ship.autopilot.universe=universe;
  CAM.x=universe.ship.pos.x;CAM.y=universe.ship.pos.y;CAM.zoom=1;CAM.follow=universe.ship;
  AUTO.classList.remove('on');AUTO.textContent='AUTO';
}
// ---- Android 16 Baklava PlatLogo screen: Starfield 1:1 + long-press launch ----
var P_NUM=128,P_PLANES=4,LAUNCH_TIME=5000,LAUNCH_DELAY=6000,ROT_DEG=45;
var mSize=2.5,mBuf=0,mRad=0;
var mStars=new Float32Array(P_NUM*4);
var mVX=200*(Math.random()-0.5),mVY=200*(Math.random()-0.5);
var warp=1,firing=false,fireT=0,holding=false,holdT0=0,launchTimer=0,_lastDraw=0;
var CW2=window.innerWidth,CH2=window.innerHeight;
function resizeStars(){
  mBuf=mSize*P_PLANES*2*16;
  mRad=(Math.hypot(CW2,CH2)/2)+mBuf;
  var r=mRad*2;
  for(var i=0;i<P_NUM;i++){
    mStars[4*i]=Math.random()*r-mRad;
    mStars[4*i+1]=Math.random()*r-mRad;
    mStars[4*i+2]=mStars[4*i];
    mStars[4*i+3]=mStars[4*i+1];
  }
}
function resizePlat(){CW2=window.innerWidth;CH2=window.innerHeight;sf.width=CW2;sf.height=CH2;resizeStars();}
function bootLoop(now){
  requestAnimationFrame(bootLoop);
  if(!started)drawStars(now);
}
function drawStars(now){
  if(!mRad)resizeStars();
  if(firing){warp=16;}
  else if(holding){var f=Math.min(1,(now-holdT0)/LAUNCH_TIME);warp=1+f*15;}
  else{warp=1;}
  var inWarp=warp>1.001;
  sctx.fillStyle='#000';sctx.fillRect(0,0,CW2,CH2);
  var dtSec=Math.min(0.05,Math.max(0,(now-(_lastDraw||now))/1000));
  _lastDraw=now;
  if(dtSec>0){
    var dx=mVX*dtSec*warp,dy=mVY*dtSec*warp;
    var dia=mRad*2,tria=mRad*3;
    for(var i=0;i<P_NUM;i++){
      var plane=(((i/P_NUM)*P_PLANES)|0)+1;
      mStars[4*i+2]=(mStars[4*i+2]+dx*plane+tria)%dia-mRad;
      mStars[4*i+3]=(mStars[4*i+3]+dy*plane+tria)%dia-mRad;
      if(inWarp){mStars[4*i]=mStars[4*i+2]-dx*warp*plane;mStars[4*i+1]=mStars[4*i+3]-dy*warp*plane;}
      else{mStars[4*i]=-10000;mStars[4*i+1]=-10000;}
    }
  }
  sctx.save();
  sctx.translate(CW2/2,CH2/2);
  sctx.rotate(ROT_DEG*Math.PI/180);
  if(dtSec>0&&warp>1.001){sctx.translate(Math.random()*(warp-1),Math.random()*(warp-1));}
  var slice=(mStars.length/P_PLANES/4)*4;
  for(var p=0;p<P_PLANES;p++){
    var value=(p+1)/(P_PLANES-1);
    var v=Math.min(255,Math.round((0.42+0.58*value)*255));
    var col='rgb('+v+','+v+','+v+')';
    var w=mSize*(p+1);
    if(inWarp){
      sctx.strokeStyle=col;sctx.lineWidth=w;sctx.lineCap='butt';
      sctx.beginPath();
      for(var j=p*slice;j<p*slice+slice;j+=4){
        if(mStars[j]>-9000){sctx.moveTo(mStars[j],mStars[j+1]);sctx.lineTo(mStars[j+2],mStars[j+3]);}
      }
      sctx.stroke();
    }
    sctx.fillStyle=col;
    for(var j2=p*slice;j2<p*slice+slice;j2+=4){
      var qx=mStars[j2+2],qy=mStars[j2+3];
      sctx.fillRect(qx-w/2,qy-w/2,w,w);
    }
  }
  sctx.restore();
  if(inWarp){
    var frac=(warp-1)/15;
    sctx.fillStyle='rgba(255,255,255,'+(frac*frac).toFixed(4)+')';
    sctx.fillRect(0,0,CW2,CH2);
  }
}
function startWarpAnim(){
  holding=true;holdT0=performance.now();warp=1;
  if(!launchTimer)launchTimer=setTimeout(function(){launch();},LAUNCH_DELAY);
}
function stopWarpAnim(){
  holding=false;
  if(launchTimer){clearTimeout(launchTimer);launchTimer=0;}
  warp=1;
}
var logoBox=document.getElementById('logoBox');
logoBox.addEventListener('pointerdown',function(e){
  if(started||firing)return;
  holding=true;
  logoBox.classList.add('pressed');
  try{logoBox.setPointerCapture(e.pointerId);}catch(err){}
  startWarpAnim();
});
logoBox.addEventListener('pointerup',function(e){
  if(started)return;
  if(!holding)return;
  logoBox.classList.remove('pressed');
  var held=performance.now()-holdT0;
  stopWarpAnim();
  if(held>=LAUNCH_TIME)launch();
});
logoBox.addEventListener('pointercancel',function(){
  if(started)return;
  if(!holding)return;
  logoBox.classList.remove('pressed');
  stopWarpAnim();
});

function launch(){
  if(started||firing)return;
  holding=false;
  logoBox.classList.remove('pressed');
  if(launchTimer){clearTimeout(launchTimer);launchTimer=0;}
  firing=true;fireT=performance.now();
  warp=16;
  setTimeout(function(){
    started=true;firing=false;
    scrPlat.style.display='none';
    document.getElementById('scr-game').style.display='block';
    resize();buildUniverse();
    hintEl.style.display='none';
    AUTO.classList.remove('on');AUTO.textContent='AUTO';
    CAT.textContent='';TEL.textContent='';
    lastt=performance.now();
    requestAnimationFrame(tick);
  },1500);
}
// keyboard
var keys={};
window.addEventListener('keydown',function(e){
  var k=e.code;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD'].indexOf(k)>=0)e.preventDefault();
  if(!keys[k])keys[k]=true;
});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
function applyKeys(){
  if(!universe||!started)return;
  var ship=universe.ship;var dt=universe.dt;
  if(ship.landing&&ship.landing.ship){// grounded: allow launch via thrust key? keep flightstick passive on ground
  }
  var mag=0;
  if(keys['ArrowUp']||keys['KeyW'])mag=1;
  else if(keys['ArrowDown']||keys['KeyS'])mag=-0.55;
  if(keys['Space'])mag=1;
  if(mag!==0||keys['ArrowLeft']||keys['KeyA']||keys['ArrowRight']||keys['KeyD']){
    if(ship.autopilot.enabled){ship.autopilot.enabled=false;AUTO.classList.remove('on');AUTO.textContent='AUTO';}
    ship.angle+=dt*1.5*((keys['ArrowLeft']||keys['KeyA'])?1:0)-dt*1.5*((keys['ArrowRight']||keys['KeyD'])?1:0);
    if(mag<0)ship.angle+=Math.PI;
    ship.thrust=new PVec(Math.cos(ship.angle)*Math.abs(mag),Math.sin(ship.angle)*Math.abs(mag));
  }else{
    ship.thrust=new PVec(0,0);
  }
}
// auto button
AUTO.addEventListener('click',function(){
  if(!universe||!started)return;
  var ap=universe.ship.autopilot;
  ap.enabled=!ap.enabled;
  if(ap.enabled){AUTO.classList.add('on');AUTO.textContent='ON';if(ap._initDist)ap._initDist=0;if(!ap.target)ap.strategy='NONE';}
  else{AUTO.classList.remove('on');AUTO.textContent='AUTO';ap.target=null;universe.ship.thrust=new PVec(0,0);}
});
document.getElementById('sbtn').addEventListener('click',function(){
  if(!started)return;
  document.getElementById('fadeout').style.opacity=1;
  setTimeout(function(){buildUniverse();document.getElementById('fadeout').style.opacity=0;},350);
});
// pointer gestures for pan / zoom
var pointers={},lastPan=null,pinch0=null,pinchD=0;
function evPos(e){var r=GCV.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
GCV.addEventListener('pointerdown',function(e){GCV.setPointerCapture(e.pointerId);pointers[e.pointerId]={x:e.clientX,y:e.clientY};lastPan={x:e.clientX,y:e.clientY};});
GCV.addEventListener('pointermove',function(e){
  if(!(e.pointerId in pointers))return;
  var ids=Object.keys(pointers);if(ids.length<2){
    var dx=e.clientX-(lastPan?lastPan.x:e.clientX),dy=e.clientY-(lastPan?lastPan.y:e.clientY);
    CAM.x-=dx/CAM.zoom;CAM.y-=dy/CAM.zoom;
    lastPan={x:e.clientX,y:e.clientY};
  }
  pointers[e.pointerId]={x:e.clientX,y:e.clientY};
  ids=Object.keys(pointers);
  if(ids.length>=2){
    var p0=pointers[ids[0]],p1=pointers[ids[1]];
    var d=Math.hypot(p0.x-p1.x,p0.y-p1.y);
    if(pinch0){var nx=(p0.x+p1.x)/2,ny=(p0.y+p1.y)/2;CAM.x-=(nx-pinch0.x)/CAM.zoom;CAM.y-=(ny-pinch0.y)/CAM.zoom;CAM.zoom=clamp(CAM.zoom*d/(pinchD||1),0.05,6);pinch0={x:nx,y:ny};pinchD=d;}
    else{pinch0={x:(p0.x+p1.x)/2,y:(p0.y+p1.y)/2};pinchD=d;}
  }
});
function endPtr(e){delete pointers[e.pointerId];if(Object.keys(pointers).length<2){pinch0=null;}lastPan=null;}
GCV.addEventListener('pointerup',endPtr);GCV.addEventListener('pointercancel',endPtr);
// boot
var started=false,universe=null;
function capUniverse(u){return u;}
resizePlat();resize();
window.addEventListener('resize',function(){resizePlat();resize();});
requestAnimationFrame(bootLoop);
